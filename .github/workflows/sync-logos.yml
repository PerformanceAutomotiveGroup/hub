name: Sync Brand Logos from GCS

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync Logos from GCS
        run: |
          mkdir -p hub/brands
          gcloud storage rsync -r gs://pag-brand-logos/brands/ ./hub/brands/

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hub/brands/
          if git diff --staged --quiet; then
            echo "No changes found. Assets up to date."
          else
            git commit -m "chore(assets): sync latest brand logos from GCS"
            git push
          fi
