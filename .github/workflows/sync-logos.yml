name: Sync Brand Logos from GCS

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync Logos from GCS
        run: |
          mkdir -p hub/brands
          gcloud storage cp -r "gs://pag-brand-logos/brands/*" ./hub/brands/

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hub/brands/
          if git diff --staged --quiet; then
            echo "No new assets found. Repository clean."
          else
            git commit -m "chore(assets): sync latest brand logos from GCS"
            git push
          fi
